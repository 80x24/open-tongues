name: Publish & Notify

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsup.config.ts'
  # 수동 릴리즈. 배포가 실패했을 때 실패한 런을 rerun 하면 **그 시점 커밋**에서 다시 돌아
  # 이미 밀어둔 버전 태그와 충돌한다 — 항상 최신 main 에서 새로 돌리는 이 경로를 쓸 것.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # skip version bump commits from this workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun test

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing(OIDC)은 npm >= 11.5.1 부터. node 24 가 npm 11 을 싣지만
      # 패치 버전까지 보장하려고 명시적으로 올린다.
      - run: npm install -g npm@latest

      # 버전 범프는 **로컬만**. 커밋·태그는 publish 성공 후에 한다 —
      # 예전엔 범프+태그를 먼저 밀어서, publish 가 실패할 때마다 배포되지도 않은 버전이
      # 하나씩 타버렸다(2026-08: repo 0.1.26 / npm 0.1.23, 미배포 태그 v0.1.25·v0.1.26 잔존).
      - name: Bump patch version (local only)
        id: bump
        run: |
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 토큰 없음 = Trusted Publishing(OIDC). NODE_AUTH_TOKEN 이 있으면 npm 이 OIDC 대신
      # 그 토큰으로 인증해버려서 2FA/OTP 벽에 다시 걸린다 — 그래서 일부러 안 넘긴다.
      - run: npm publish --provenance --access public

      - name: Commit & tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          # -a 필수: --follow-tags 는 annotated 태그만 민다 (lightweight 는 조용히 스킵)
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"
          git push --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes
